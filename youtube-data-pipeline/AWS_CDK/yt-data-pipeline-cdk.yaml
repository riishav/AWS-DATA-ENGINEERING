        PythonVersion: "3"
      GlueVersion: "5.1"
      MaxRetries: 0
      Timeout: 480
      NumberOfWorkers: 2
      WorkerType: "G.1X"
      ExecutionClass: "STANDARD"
      ExecutionProperty:
        MaxConcurrentRuns: 1
      DefaultArguments:
        "--silver_database": "yt_pipeline_silver_dev"
        "--enable-glue-datacatalog": ""
