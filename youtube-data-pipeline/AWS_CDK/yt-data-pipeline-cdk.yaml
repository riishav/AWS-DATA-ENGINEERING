Attempts":2,"BackoffRate":2}],"End":true}}],"ResultPath":"$.parallel_results","Catch":[{"ErrorEquals":["States.ALL"],"Next":"NotifyTransformFailure","ResultPath":"$.error"}],"Next":"RunDataQualityChecks"},"RunDataQualityChecks":{"Type":"Task","Resource":"arn:aws:states:::lambda:invoke","Parameters":{"FunctionName":"arn:aws:lambda:ap-south-1:[Account-ID]:function:yt-data-pipeline-data-quality-dev","Payload":{"layer":"silver","database":"yt_pipeline_silver_dev","tables":["clean_statistics","clean_reference_data"]}},"ResultPath":"$.dq_result","Retry":[{"ErrorEquals":["States.ALL"],"IntervalSeconds":15,"MaxAttempts":2,"BackoffRate":2}],"Next":"EvaluateDataQuality"},"EvaluateDataQuality":{"Type":"Choice","Choices":[{"Variable":"$.dq_result.Payload.quality_passed","BooleanEquals":true,"Next":"RunSilverToGoldGlueJob"}],"Default":"NotifyDQFailure"},"RunSilverToGoldGlueJob":{"Type":"Task","Resource":"arn:aws:states:::glue:startJobRun.sync","Parameters":{"JobName":"yt-data-pipeline-silver-to-gold-dev","Arguments":{"--silver_database":"yt_pipeline_silver_dev","--gold_bucket":"yt-data-gold-dev","--gold_database":"yt_pipeline_gold_dev"}},"ResultPath":"$.glue_gold_result","Retry":[{"ErrorEquals":["States.ALL"],"IntervalSeconds":60,"MaxAttempts":2,"BackoffRate":2}],"Catch":[{"ErrorEquals":["States.ALL"],"Next":"NotifyGoldFailure","ResultPath":"$.error"}],"Next":"NotifySuccess"},"NotifySuccess":{"Type":"Task","Resource":"arn:aws:states:::sns:publish","Parameters":{"TopicArn":"arn:aws:sns:ap-south-1:[Account-ID]:yt-data-pipeline-alerts-dev","Subject":"[YT Pipeline] Pipeline completed successfully","Message.$":"States.Format('Pipeline run {} completed. All layers updated.', $$.Execution.Id)"},"End":true},"NotifyIngestionFailure":{"Type":"Task","Resource":"arn:aws:states:::sns:publish","Parameters":{"TopicArn":"arn:aws:sns:ap-south-1:[Account-ID]:yt-data-pipeline-alerts-dev","Subject":"[YT Pipeline] FAILURE ? Ingestion step failed","Message.$":"States.JsonToString($.error)"},"End":true},"NotifyTransformFailure":{"Type":"Task","Resource":"arn:aws:states:::sns:publish","Parameters":{"TopicArn":"arn:aws:sns:ap-south-1:[Account-ID]:yt-data-pipeline-alerts-dev","Subject":"[YT Pipeline] FAILURE ? Transform step failed","Message.$":"States.JsonToString($.error)"},"End":true},"NotifyDQFailure":{"Type":"Task","Resource":"arn:aws:states:::sns:publish","Parameters":{"TopicArn":"arn:aws:sns:ap-south-1:[Account-ID]:yt-data-pipeline-alerts-dev","Subject":"[YT Pipeline] WARNING ? Data quality checks failed","Message.$":"States.JsonToString($.dq_result)"},"End":true},"NotifyGoldFailure":{"Type":"Task","Resource":"arn:aws:states:::sns:publish","Parameters":{"TopicArn":"arn:aws:sns:ap-south-1:[Account-ID]:yt-data-pipeline-alerts-dev","Subject":"[YT Pipeline] FAILURE ? Gold aggregation failed","Message.$":"States.JsonToString($.error)"},"End":true}}}

      EncryptionConfiguration:
